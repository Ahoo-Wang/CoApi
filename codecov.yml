coverage:
  range: 80..100
  round: down
  precision: 2
  status:
    # Overall coverage must not drop more than 1% below the base commit.
    project:
      default:
        target: auto
        threshold: 1%
    # New and changed lines must be well covered.
    patch:
      default:
        target: 90%
ignore:
  - "example/.*"
